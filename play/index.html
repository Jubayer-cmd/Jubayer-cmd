<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bug Hunt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
  :root { --ink: #15171c; --graphite: #5e6370; --hairline: #dde0e5; --teal: #0a6b66; --bg: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e6e8eb; --graphite: #9aa1ad; --hairline: #30363d; --teal: #3fb8ad; --bg: #0d1117; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 'IBM Plex Mono', ui-monospace, monospace; }
  main { max-width: 932px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font: 700 40px/1.1 'Bricolage Grotesque', sans-serif; margin: 0 0 4px; }
  p { color: var(--graphite); margin: 0 0 20px; }
  canvas { display: block; width: 100%; border: 1px solid var(--hairline); border-radius: 12px; touch-action: none; }
  a { color: var(--teal); }
  a:focus-visible, canvas:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
  .keys { margin-top: 14px; }
</style>
</head>
<body>
<main>
  <h1>Bug hunt</h1>
  <p>One bug made it to production. Every shot is a skill. Fix it.</p>
  <canvas id="game" tabindex="0" aria-label="Bug hunt game. Arrow keys move, Space fires."></canvas>
  <p class="keys">← → or A D to move · Space to fire · on a phone, drag to move and the ship fires by itself.<br>
    <a href="https://github.com/Jubayer-cmd">Back to my GitHub profile</a></p>
</main>
<script>
(() => {
  const W = 900, H = 560;
  const BOSS = [
    ["....XX....XX....", ".....XX..XX.....", "....XXXXXXXX....", "...XXXXXXXXXX...", "..XXX.XXXX.XXX..",
     ".XXXXXXXXXXXXXX.", "XXXXXXXXXXXXXXXX", "XX.XXXXXXXXXX.XX", "XX.XX......XX.XX", "...XXX....XXX..."],
    ["....XX....XX....", ".....XX..XX.....", "....XXXXXXXX....", "...XXXXXXXXXX...", "..XXX.XXXX.XXX..",
     ".XXXXXXXXXXXXXX.", "XXXXXXXXXXXXXXXX", "XX.XXXXXXXXXX.XX", "...XX......XX...", ".XXX........XXX."],
  ];
  const BP = 8, BOSS_W = 16 * BP, BOSS_H = 10 * BP, BOSS_Y = 70;
  const SHIP = [".....X.....", "....XXX....", "....XXX....", ".XXXXXXXXX.", "XXXXXXXXXXX", "XXXXXXXXXXX"];
  const SP = 4, SHIP_Y = H - 64;
  const SKILLS = ["TypeScript", "React", "Next.js", "Node.js", "NestJS", "Python", "FastAPI", "PostgreSQL",
                  "MongoDB", "Redis", "Docker", "AWS", "LangGraph", "MCP", "Tailwind", "gRPC"];

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const colors = {};
  const readColors = () => {
    const s = getComputedStyle(document.documentElement);
    for (const k of ["ink", "graphite", "hairline", "teal", "bg"]) colors[k] = s.getPropertyValue("--" + k).trim();
  };
  readColors();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readColors);

  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  canvas.style.aspectRatio = `${W} / ${H}`;

  let best = 0;
  try { best = +localStorage.getItem("bughunt-best") || 0; } catch {}

  const stars = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 0.6 + 0.2 }));
  let state = "title", level, boss, ship, shots, bombs, sparks, frame, cooldown, skillIndex, landed, lives, wonAt;

  function newBoss() {
    const hp = 24 + level * 12;
    boss = { x: W / 2 - BOSS_W / 2, vx: 1.6 + level * 0.4, hp, maxHp: hp, flash: 0, bombIn: 70 };
  }
  function reset() {
    level = 0; landed = 0; lives = 3; frame = 0; cooldown = 0; skillIndex = 0;
    ship = { x: W / 2, hurt: 0 };
    shots = []; bombs = []; sparks = [];
    newBoss();
  }
  reset();

  const keys = {};
  let fireQueued = false;  // a tap can start and end between two frames
  addEventListener("keydown", e => {
    if (document.activeElement !== canvas) return;
    if (["ArrowLeft", "ArrowRight", " ", "Enter"].includes(e.key)) e.preventDefault();
    keys[e.key.toLowerCase()] = true;
    if (e.key === " " && state === "play") fireQueued = true;
    if ((e.key === " " || e.key === "Enter") && (state === "title" || state === "over")) start();
  });
  addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

  let touchX = null;
  const toGame = e => { const r = canvas.getBoundingClientRect(); return (e.clientX - r.left) / r.width * W; };
  canvas.addEventListener("pointerdown", e => {
    canvas.focus();
    if (state === "title" || state === "over") { start(); return; }
    if (e.pointerType !== "mouse") touchX = toGame(e);
  });
  canvas.addEventListener("pointermove", e => { if (touchX !== null) touchX = toGame(e); });
  addEventListener("pointerup", () => { touchX = null; });

  function start() { reset(); state = "play"; }

  function sprite(pattern, p, x, y, color) {
    x = Math.round(x); y = Math.round(y);  // fractional positions leave seams between the pixels
    ctx.fillStyle = color;
    pattern.forEach((row, r) => [...row].forEach((ch, c) => { if (ch === "X") ctx.fillRect(x + c * p, y + r * p, p, p); }));
  }
  function burst(x, y, color, n = 14, power = 3) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = Math.random() * power + 1;
      sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 34, color });
    }
  }
  function pillWidth(text) { ctx.font = "13px 'IBM Plex Mono', monospace"; return ctx.measureText(text).width + 20; }

  function update() {
    frame++;
    for (const s of stars) { s.y += s.s; if (s.y > H) { s.y = 0; s.x = Math.random() * W; } }
    sparks = sparks.filter(p => (p.x += p.vx, p.y += p.vy, p.vx *= 0.95, p.vy *= 0.95, --p.life > 0));
    if (state === "won" && frame - wonAt > 150) { level++; newBoss(); state = "play"; }
    if (state !== "play" && state !== "won") return;

    // ship
    if (keys["arrowleft"] || keys["a"]) ship.x -= 6;
    if (keys["arrowright"] || keys["d"]) ship.x += 6;
    if (touchX !== null) ship.x += Math.max(-7, Math.min(7, touchX - ship.x));
    ship.x = Math.max(30, Math.min(W - 30, ship.x));
    if (ship.hurt) ship.hurt--;
    if (cooldown) cooldown--;
    const firing = keys[" "] || fireQueued || touchX !== null;
    if (state === "play" && firing && !cooldown && shots.length < 4) {
      const text = SKILLS[skillIndex++ % SKILLS.length];
      shots.push({ x: ship.x, y: SHIP_Y - 30, text, w: pillWidth(text) });
      cooldown = 12; fireQueued = false;
    }
    shots = shots.filter(s => (s.y -= 9) > -30);

    if (state !== "play") return;

    // boss: drifts and bounces, gets faster and angrier as its HP drops
    const rage = 1 + (1 - boss.hp / boss.maxHp);
    boss.x += boss.vx * rage;
    if (boss.x < 20 || boss.x > W - BOSS_W - 20) boss.vx *= -1;
    if (Math.random() < 0.006) boss.vx *= -1;
    if (boss.flash) boss.flash--;
    if (--boss.bombIn <= 0) {
      const cx = boss.x + BOSS_W / 2, spread = boss.hp < boss.maxHp / 2 ? [-1.6, 0, 1.6] : [0];
      const aim = Math.max(-1.5, Math.min(1.5, (ship.x - cx) / 200));
      for (const vx of spread) bombs.push({ x: cx, y: BOSS_Y + BOSS_H, vx: vx + aim, vy: 3.2 + level * 0.4 });
      boss.bombIn = Math.max(26, 64 - level * 8) + Math.random() * 24;
    }
    bombs = bombs.filter(b => (b.x += b.vx, b.y += b.vy) < H + 20);

    for (const s of shots) {
      if (s.y < BOSS_Y + BOSS_H - 6 && s.y > BOSS_Y - 10 && s.x + s.w / 2 > boss.x + 8 && s.x - s.w / 2 < boss.x + BOSS_W - 8) {
        s.hit = true; boss.hp--; boss.flash = 6; landed++;
        burst(s.x, s.y, colors.teal, 8, 2);
      }
    }
    shots = shots.filter(s => !s.hit);
    if (boss.hp <= 0) {
      burst(boss.x + BOSS_W / 2, BOSS_Y + BOSS_H / 2, colors.teal, 60, 6);
      bombs = []; state = "won"; wonAt = frame;
      saveBest();
    }

    for (const b of bombs) {
      if (!ship.hurt && Math.abs(b.x - ship.x) < 22 && b.y > SHIP_Y - 4 && b.y < SHIP_Y + 24) { b.hit = true; hurt(); }
    }
    bombs = bombs.filter(b => !b.hit);
  }
  function hurt() {
    burst(ship.x, SHIP_Y + 10, colors.ink);
    lives--; ship.hurt = 90;
    if (lives <= 0) { state = "over"; saveBest(); }
  }
  function saveBest() {
    if (landed > best) { best = landed; try { localStorage.setItem("bughunt-best", best); } catch {} }
  }

  function draw() {
    ctx.fillStyle = colors.bg; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = colors.graphite;
    for (const s of stars) { ctx.globalAlpha = s.s * 0.7; ctx.fillRect(s.x, s.y, 2, 2); }
    ctx.globalAlpha = 1;

    // HUD: level, boss HP bar, score and lives
    ctx.font = "15px 'IBM Plex Mono', monospace"; ctx.textBaseline = "alphabetic";
    ctx.textAlign = "left"; ctx.fillStyle = colors.teal; ctx.fillText(`level ${level + 1}`, 20, 30);
    ctx.textAlign = "right"; ctx.fillStyle = colors.graphite;
    ctx.fillText(`skills landed ${landed}   best ${best}   ${"♥ ".repeat(Math.max(0, lives)).trim()}`, W - 20, 30);
    if (state !== "title") {
      const bw = 240, bx = W / 2 - bw / 2;
      ctx.textAlign = "center"; ctx.fillText("production bug", W / 2, 30);
      ctx.fillStyle = colors.hairline; ctx.fillRect(bx, 40, bw, 8);
      ctx.fillStyle = colors.graphite; ctx.fillRect(bx, 40, bw * Math.max(0, boss.hp) / boss.maxHp, 8);
    }

    if (state !== "won") {
      const legs = Math.floor(frame / 24) % 2;
      sprite(BOSS[legs], BP, boss.x, BOSS_Y, boss.flash ? colors.teal : colors.graphite);
    }

    // skill shots
    ctx.font = "13px 'IBM Plex Mono', monospace"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (const s of shots) {
      ctx.fillStyle = colors.teal;
      ctx.beginPath(); ctx.roundRect(s.x - s.w / 2, s.y - 11, s.w, 22, 11); ctx.fill();
      ctx.fillStyle = colors.bg; ctx.fillText(s.text, s.x, s.y + 1);
    }
    ctx.textBaseline = "alphabetic";

    ctx.fillStyle = colors.ink;
    for (const b of bombs) { ctx.fillRect(b.x - 2, b.y, 4, 4); ctx.fillRect(b.x - 4, b.y + 4, 8, 4); ctx.fillRect(b.x - 2, b.y + 8, 4, 4); }
    for (const p of sparks) { ctx.globalAlpha = p.life / 34; ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 3, 3); }
    ctx.globalAlpha = 1;
    if (state !== "title" && state !== "over" && !(ship.hurt && frame % 10 < 5)) sprite(SHIP, SP, ship.x - 22, SHIP_Y, colors.teal);

    const banner = {
      title: ["Bug hunt", "press Space or tap to start"],
      over: ["Shipped with bugs", `you landed ${landed} skills · Space or tap to try again`],
      won: ["Production bug fixed", `level ${level + 2} incoming…`],
    }[state];
    if (banner) {
      ctx.globalAlpha = 0.88; ctx.fillStyle = colors.bg; ctx.fillRect(0, H / 2 - 50, W, 110); ctx.globalAlpha = 1;
      ctx.textAlign = "center";
      ctx.fillStyle = colors.teal; ctx.font = "700 44px 'Bricolage Grotesque', sans-serif";
      ctx.fillText(banner[0], W / 2, H / 2 + 6);
      ctx.fillStyle = colors.graphite; ctx.font = "16px 'IBM Plex Mono', monospace";
      ctx.fillText(banner[1], W / 2, H / 2 + 40);
    }
  }

  const loop = () => { update(); draw(); requestAnimationFrame(loop); };
  loop();
  canvas.focus({ preventScroll: true });
})();
</script>
</body>
</html>
